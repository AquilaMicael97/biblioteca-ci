name: Testes-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
jobs:
  teste-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      #- name: Set up Python 3.11
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q
    imagem:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v3
        - run: docker build -t biblioteca-ci:latest .
        - run: docker run -d --name biblioteca-ci -p 8000:8000 biblioteca-ci:latest
        - run: sleep 10
        - run: curl -fsS http://localhost:8000/saude; then exit 0

